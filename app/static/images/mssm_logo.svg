  </defs>

  <!-- Outer Shield Border -->
  <path d="M 20 20 L 180 20 L 180 140 C 180 190 100 225 100 225 C 100 225 20 190 20 140 Z" fill="#ffffff" stroke="#000000" stroke-width="4"/>

