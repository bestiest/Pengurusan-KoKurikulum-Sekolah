  <text x="100" y="58" font-family="'Plus Jakarta Sans', Arial, sans-serif" font-weight="900" font-size="24" fill="#1e1b4b" text-anchor="middle" letter-spacing="3">MSSM</text>

  <!-- Lower Dark Blue Shield Area -->
  <path d="M 24 75 L 176 75 L 176 138 C 176 184 100 217 100 217 C 100 217 24 184 24 138 Z" fill="url(#shieldGrad)"/>

  <circle cx="100" cy="120" r="32" fill="none" stroke="url(#goldGrad)" stroke-width="3.5" stroke-dasharray="6 2"/>
  <circle cx="100" cy="120" r="22" fill="#eab308" opacity="0.15"/>
  
  <path d="M 82 125 C 80 110, 90 98, 100 98 C 110 98, 120 110, 118 125 C 115 138, 108 145, 100 148 C 92 145, 85 138, 82 125 Z" fill="url(#goldGrad)"/>
  <circle cx="94" cy="115" r="2" fill="#1e1b4b"/>
  <circle cx="106" cy="115" r="2" fill="#1e1b4b"/>
  <path d="M 96 128 L 100 132 L 104 128 Z" fill="#1e1b4b"/>
  <path d="M 92 135 Q 100 140 108 135" stroke="#1e1b4b" stroke-width="1.5" fill="none"/>

  <text x="100" y="172" font-family="'Plus Jakarta Sans', Arial, sans-serif" font-weight="800" font-size="8" fill="#fef08a" text-anchor="middle" letter-spacing="0.5">MAJLIS SUKAN SEKOLAH</text>
  <text x="100" y="184" font-family="'Plus Jakarta Sans', Arial, sans-serif" font-weight="900" font-size="9" fill="#ffffff" text-anchor="middle" letter-spacing="1">MALAYSIA</text>
