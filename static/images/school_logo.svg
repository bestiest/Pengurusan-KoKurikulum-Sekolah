<svg xmlns=http://www.w3.org/2000/svg viewBox=0 0 200 200 width=100% height=100%>
  <defs>
    <linearGradient id=gradShield x1=0% y1=0% x2=100% y2=100%>
      <stop offset=0% stop-color=#1e3a8a />
      <stop offset=50% stop-color=#0284c7 />
      <stop offset=100% stop-color=#059669 />
    </linearGradient>
    <linearGradient id=gradGold x1=0% y1=0% x2=100% y2=100%>
      <stop offset=0% stop-color=#fbbf24 />
      <stop offset=100% stop-color=#d97706 />
    </linearGradient>
    <filter id=shadow x=-10% y=-10% width=120% height=120%>
      <feDropShadow dx=0 dy=4 stdDeviation=4 flood-opacity=0.25/>
    </filter>
  </defs>

  <!-- Outer Shield Crest -->
  <path d=M 100 12 C 145 12 180 25 180 55 C 180 120 145 170 100 190 C 55 170 20 120 20 55 C 20 25 55 12 100 12 Z 
        fill=url(#gradShield) stroke=#ffffff stroke-width=4 filter=url(#shadow)/>

  <!-- Inner Gold Trim Shield -->
  <path d=M 100 20 C 138 20 168 31 168 57 C 168 114 138 158 100 176 C 62 158 32 114 32 57 C 32 31 62 20 100 20 Z 
        fill=#ffffff stroke=#f59e0b stroke-width=2/>

  <!-- Top Banner: SKSD -->
  <path d=M 50 32 L 150 32 L 140 46 L 60 46 Z fill=#1e3a8a/>
  <text x=100 y=42 font-family='Segoe UI', Arial, sans-serif font-size=9 font-weight=900 fill=#ffffff text-anchor=middle letter-spacing=1>SK SUNGAI DENDANG</text>

  <!-- Upper Center: Flaming Torch (Knowledge & Sports) -->
  <!-- Torch Handle -->
  <path d=M 97 90 L 103 90 L 101 108 L 99 108 Z fill=#78350f/>
  <path d=M 94 88 L 106 88 L 103 93 L 97 93 Z fill=url(#gradGold)/>
  <!-- Flames -->
  <path d=M 100 60 C 92 70 94 78 97 84 C 99 88 101 88 103 84 C 106 78 108 70 100 60 Z fill=#ef4444/>
  <path d=M 100 66 C 96 73 97 79 99 83 C 100 85 101 85 101 83 C 103 79 104 73 100 66 Z fill=#fbbf24/>

  <!-- Center Left: Sports & Co-Curricular Gear / Star -->
  <circle cx=65 cy=85 r=14 fill=#0284c7 opacity=0.15/>
  <path d=M 65 74 L 67 81 L 74 81 L 68 85 L 70 92 L 65 88 L 60 92 L 62 85 L 56 81 L 63 81 Z fill=#0284c7/>

  <!-- Center Right: Atom / STEM / Activity Symbol -->
  <ellipse cx=135 cy=85 rx=14 ry=5 fill=none stroke=#059669 stroke-width=2 transform=rotate(30 135 85)/>
  <ellipse cx=135 cy=85 rx=14 ry=5 fill=none stroke=#059669 stroke-width=2 transform=rotate(-30 135 85)/>
  <circle cx=135 cy=85 r=3 fill=#059669/>

  <!-- Lower Center: Open Book (Ilmu) -->
  <path d=M 100 128 C 88 122 72 120 54 125 L 54 145 C 72 140 88 142 100 148 C 112 142 128 140 146 145 L 146 125 C 128 120 112 122 100 128 Z 
        fill=#f8fafc stroke=#1e3a8a stroke-width=2.5/>
  <path d=M 100 128 L 100 148 stroke=#1e3a8a stroke-width=2.5/>
  <!-- Book lines -->
  <line x1=62 y1=130 x2=90 y2=128 stroke=#94a3b8 stroke-width=1.5/>
  <line x1=62 y1=136 x2=90 y2=134 stroke=#94a3b8 stroke-width=1.5/>
  <line x1=110 y1=128 x2=138 y2=130 stroke=#94a3b8 stroke-width=1.5/>
  <line x1=110 y1=134 x2=138 y2=136 stroke=#94a3b8 stroke-width=1.5/>

  <!-- Bottom Ribbon with Motto -->
  <path d=M 36 158 L 50 152 L 100 162 L 150 152 L 164 158 L 154 172 L 100 178 L 46 172 Z fill=#1e3a8a stroke=#ffffff stroke-width=1/>
  <text x=100 y=169 font-family='Segoe UI', Arial, sans-serif font-size=7.5 font-weight=bold fill=#facc15 text-anchor=middle letter-spacing=0.5>BERILMU BERBAKTI</text>
</svg>
